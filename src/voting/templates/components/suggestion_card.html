{% load i18n %}
<li class="suggestion">
    <a href="{% url "book" book.original_version.pk %}"
       class="book_card {% if highlighted %}highlighted{% endif %}"
       id="book_card__{{ book.pk }}">
        {% include "components/book_info_card.html" %}
        {% if suggested_by %}
            <div class="suggested_by label">{{ suggested_by }}</div>
        {% endif %}
        {% if voted_for %}
            <div class="selected label">
                <i class="fa-solid fa-circle-check"></i>
            </div>
        {% endif %}
        {% if votes is not None %}
            <div class="votes label">{{ votes }}</div>
        {% endif %}
    </a>
</li>
