name: Container Build test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "**/*.py" # Can be removed if we move modules into src/ directory
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false # False for this workflow as it's a test that the container can build. Can be changed later.
          tags: fellowship-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
