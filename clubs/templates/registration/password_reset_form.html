{% extends "shared/base.html" %}
{% load i18n static %}
{% block title %}
    {% translate "Log in" %}
{% endblock title %}
{% block head %}
    <link rel="stylesheet" href="{% static "styles/login_styles.css" %}">
{% endblock head %}
{% block page_class %}login{% endblock page_class %}
{% block content %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="big" type="submit">{% translate "Reset password" %}</button>
    </form>
{% endblock content %}
