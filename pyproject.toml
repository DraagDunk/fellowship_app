[project]
name = "fellowship-app"
version = "0.1.0"
authors = [
  { name = "Jesper Dam Gynther Knudgaard" },
  { name = "Marcus Flyvholm Haagh" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14, <3.15"
dependencies = [
    "asgiref==3.11.1",
    "django==6.0.5",
    "gunicorn==26.0.0",
    "packaging==26.2",
    "psycopg2-binary==2.9.12",
    "sqlparse==0.5.5",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
]

[tool.uv]
# We don't install the newest version to help reduce risk of supply-chain attacks
exclude-newer = "7 days"
audit.malware-check = true
