{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon"
              type="image/png"
              sizes="16x16"
              href="{% static "favicons/favicon-16x16.png" %}">
        <link rel="icon"
              type="image/png"
              sizes="32x32"
              href="{% static "favicons/favicon-32x32.png" %}">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        {% block head %}
        {% endblock head %}
    </head>
    <body>
        <div id="page">
            <div id="header">
                <nav id="menu">
                    <ul>
                        {% include "shared/menu.html" %}
                    </ul>
                </nav>
            </div>
            {% block content %}
            {% endblock content %}
        </div>
        {% block scripts %}
        {% endblock scripts %}
    </body>
</html>
