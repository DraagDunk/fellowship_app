{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon"
              type="image/png"
              sizes="16x16"
              href="{% static "favicons/favicon-16x16.png" %}">
        <link rel="icon"
              type="image/png"
              sizes="32x32"
              href="{% static "favicons/favicon-32x32.png" %}">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="{% static "styles/page_styles.css" %}">
        <link rel="stylesheet" href="{% static "styles/nav_styles.css" %}">
        {% block head %}
        {% endblock head %}
    </head>
    <body>
        <header>
            {% include "shared/menu.html" %}
        </header>
        <div class="page">
            <div class="content">
                {% block content %}
                {% endblock content %}
            </div>
        </div>
        {% block scripts %}
        {% endblock scripts %}
        <script src="{% static "js/navbar.js" %}"></script>
    </body>
</html>
