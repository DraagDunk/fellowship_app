{% extends 'shared/base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% translate "Books" %}{% endblock title %}

{% block head %}
    <link rel="stylesheet" href="{% static "styles/book_styles.css" %}"/>
{% endblock head%}

{% block content %}
    {% for book in books %}
        <a class="book_container" href="{% url "book" book.pk %}">
            <img src="{{ book.cover_image }}"/>
        </a>
    {% endfor %}
{% endblock content %}
